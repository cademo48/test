<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello World Confetti</title>
  <style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block}</style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const W = 1280, H = 720, DURATION = 5;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1033);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 100);
camera.position.z = 12;

// "Hello World" drawn on a canvas texture
const tc = document.createElement('canvas');
tc.width = 2048; tc.height = 512;
const ctx = tc.getContext('2d');
ctx.font = 'bold 260px sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.lineWidth = 16;
ctx.strokeStyle = '#ff3d7f';
ctx.strokeText('Hello World', 1024, 256);
ctx.fillStyle = '#ffffff';
ctx.fillText('Hello World', 1024, 256);
const text = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 2.5),
  new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(tc), transparent: true })
);
scene.add(text);

// Confetti: instanced quads with deterministic per-piece motion
const COUNT = 600;
const colors = [0xff3d7f, 0xffd93d, 0x3dd6ff, 0x6bff6b, 0xb06bff, 0xff8a3d];
const confetti = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(0.18, 0.1),
  new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }),
  COUNT
);
confetti.frustumCulled = false;  // instances move far from their initial bounds
scene.add(confetti);

let seed = 42;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const pieces = [];
const color = new THREE.Color();
for (let i = 0; i < COUNT; i++) {
  const side = i % 2 ? 1 : -1;  // two cannons, bottom left and right
  const angle = Math.PI / 2 + side * (0.15 + rand() * 0.45);
  const speed = 9 + rand() * 7;
  pieces.push({
    start: rand() * 1.2 + (i % 3 === 0 ? 1.8 : 0),  // second burst
    p0: new THREE.Vector3(side * 8, -5, rand() * 2 - 1),
    v0: new THREE.Vector3(Math.cos(angle) * speed, Math.sin(angle) * speed, rand() * 4 - 2),
    spin: new THREE.Vector3(rand() * 10, rand() * 10, rand() * 10),
    sway: rand() * Math.PI * 2,
  });
  confetti.setColorAt(i, color.set(colors[Math.floor(rand() * colors.length)]));
}

const dummy = new THREE.Object3D();
const GRAVITY = 6, DRAG = 1.2;

window.renderFrame = (t) => {
  // Text pops in with an elastic scale, then gently bobs
  const k = Math.min(t / 0.8, 1);
  const pop = k === 1 ? 1 : 1 - Math.pow(2, -10 * k) * Math.cos(k * Math.PI * 4.5);
  text.scale.setScalar(Math.max(pop, 0.001));
  text.position.y = Math.sin(t * 2) * 0.15;
  text.rotation.z = Math.sin(t * 1.5) * 0.04;

  for (let i = 0; i < COUNT; i++) {
    const c = pieces[i];
    const dt = t - c.start;
    if (dt < 0) { dummy.position.set(0, -100, 0); }
    else {
      // velocity with linear drag, plus gravity: closed form
      const e = (1 - Math.exp(-DRAG * dt)) / DRAG;
      dummy.position.set(
        c.p0.x + c.v0.x * e + Math.sin(dt * 3 + c.sway) * 0.3,
        c.p0.y + c.v0.y * e - (GRAVITY / DRAG) * (dt - e),
        c.p0.z + c.v0.z * e
      );
      dummy.rotation.set(c.spin.x * dt, c.spin.y * dt, c.spin.z * dt);
    }
    dummy.updateMatrix();
    confetti.setMatrixAt(i, dummy.matrix);
  }
  confetti.instanceMatrix.needsUpdate = true;
  renderer.render(scene, camera);
};
window.DURATION = DURATION;
window.ready = true;

// Live preview when opened directly in a browser (render.js drives frames itself)
if (!window.__capture) {
  const t0 = performance.now();
  renderer.setAnimationLoop(() => window.renderFrame(((performance.now() - t0) / 1000) % DURATION));
}
</script>
</body>
</html>
